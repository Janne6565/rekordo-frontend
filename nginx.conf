# Port 8080, not 80: this runs on nginxinc/nginx-unprivileged as UID 101, which cannot
# bind a privileged port.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The two files that are not client routes, and must not be treated as such.
    #
    # The phone's webview loads the page to draw the bot check, and the page loads the
    # script. Under the rule above a missing file falls through to index.html and answers
    # 200 -- so a deploy that had not landed yet served the whole application into a
    # 72-pixel box, which rendered the SPA's own "Not Found" and looked for all the world
    # like a bug in the check. A real 404 is something the app can report, with a code,
    # instead of silently drawing someone else's page.
    #
    # A regex location, so both files get this and neither can quietly fall back to the
    # prefix rule. The script was inline until the CSP went up; it has to keep the page's
    # two properties, or it reintroduces exactly the bug the page was hardened against.
    location ~ ^/turnstile\.(html|js)$ {
        try_files $uri =404;
        # Never cached. It carries no Cache-Control otherwise, and a webview left to its own
        # heuristics will happily reuse whatever it got last time -- which, for anyone who
        # opened the app before this page was deployed, is a cached copy of index.html
        # answering 200 forever. A page this small, fetched once per sign-in, is not worth
        # caching under any circumstances.
        add_header Cache-Control "no-store" always;
    }

    # faro:begin
    # First-party route for frontend diagnostics, proxied to the Grafana Faro collector.
    #
    # Why it exists: sent straight to faro-collector-*.grafana.net, the requests are on the
    # common privacy blocklists (EasyPrivacy, uBlock Origin), and a blocked request fails
    # before any response -- so a reader who opted in on the consent slip and runs a blocker
    # sends nothing and nobody ever finds out. The in-app opt-in is the consent gate; this
    # route only decides whether an answer that was already given can be delivered.
    #
    # Same-origin also means the browser now attaches things it never sent cross-origin:
    # this site's cookies, the full page URL as Referer, and Traefik's copy of the client IP.
    # None of that is Grafana's business, and at the anonymous level the Referer alone would
    # re-add the record id the payload scrubs out. Every one is stripped below, so the
    # collector sees less than it did on the direct route, not more.
    #
    # Exact match and POST only, forwarding to one fixed collector URL, so this cannot be
    # used as an open relay to anything else on grafana.net. The upstream is substituted at
    # build time from the FARO_UPSTREAM build arg; without it this whole block is removed.
    location = /faro/collect {
        limit_except POST { deny all; }
        client_max_body_size 1m;

        proxy_pass __FARO_UPSTREAM__;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
    }
    # faro:end

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
