# Port 8080, not 80: this runs on nginxinc/nginx-unprivileged as UID 101, which cannot
# bind a privileged port.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The one page that is not a client route, and must not be treated as one.
    #
    # The phone's webview loads this to draw the bot check. Under the rule above a missing
    # file falls through to index.html and answers 200 -- so a deploy that had not landed yet
    # served the whole application into a 72-pixel box, which rendered the SPA's own "Not
    # Found" and looked for all the world like a bug in the check. A real 404 is something
    # the app can report, with a code, instead of silently drawing someone else's page.
    location = /turnstile.html {
        try_files $uri =404;
        # Never cached. It carries no Cache-Control otherwise, and a webview left to its own
        # heuristics will happily reuse whatever it got last time -- which, for anyone who
        # opened the app before this page was deployed, is a cached copy of index.html
        # answering 200 forever. A page this small, fetched once per sign-in, is not worth
        # caching under any circumstances.
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
