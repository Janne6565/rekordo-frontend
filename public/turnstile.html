<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verification</title>
    <!--
      The bot check, on a page of its own, for the phone's webview to load.

      This exists because a webview cannot be handed an HTML string here. React Native
      renders one with loadHTMLString(baseURL:), and a document loaded that way has no real
      origin however respectable the baseURL looks -- so Turnstile refused to run and the app
      showed "the check could not be loaded". The same site key on the same domain has always
      worked in an ordinary browser tab, which is what narrowed it down.

      So the widget is served from the app's own domain as a real document, over https, from
      an origin that is genuinely what it says it is. That is also why the site key is fetched
      here rather than passed in the query string: same origin, so the page can simply ask.

      Kept as a static file rather than a route in the SPA: nginx serves a real file before it
      falls through to index.html, and booting the whole application inside a 72-pixel webview
      to draw one widget would be absurd.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* Matches the app's paper. The webview is exactly the widget's size, so anything
           that overflows is a scrollbar over a checkbox rather than something to reach. */
        background: #faf8f5;
        overflow: hidden;
      }
    </style>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onloadTurnstileCallback"
      async
      defer
    ></script>
  </head>
  <body>
    <div id="widget"></div>
    <script>
      (function () {
        /* Only the four the server knows. Anything else is refused here rather than sent to
           Cloudflare, so a stray query string cannot mint a token for an action that does not
           exist -- and cannot put arbitrary text into the widget's parameters. */
        var ACTIONS = ["register", "login", "forgot-password", "request-email-confirmation"];

        var params = new URLSearchParams(window.location.search);
        var action = params.get("action");
        var language = params.get("lang") || "auto";

        function post(message) {
          /* The webview is the only consumer. Opened directly in a browser this is simply a
             blank page with a checkbox on it, which is harmless. */
          if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify(message));
          }
        }

        function fail(code) {
          post({ type: "error", code: code });
        }

        if (ACTIONS.indexOf(action) === -1) {
          fail("unknown-action");
          return;
        }

        var siteKey = null;
        var scriptReady = false;

        function drawWhenReady() {
          if (!scriptReady || siteKey === null) return;
          try {
            window.turnstile.render(document.getElementById("widget"), {
              sitekey: siteKey,
              action: action,
              language: language,
              theme: "light",
              size: "normal",
              callback: function (token) {
                post({ type: "token", token: token });
              },
              /* Five minutes is easily long enough for somebody to be interrupted mid-form,
                 so an expired challenge is reported rather than left looking solved. */
              "expired-callback": function () {
                post({ type: "expired" });
              },
              /* The code is passed on deliberately. The first version of this swallowed it,
                 and "the check could not be loaded" with no code behind it is a sentence
                 nobody can act on -- 110200 (domain not allowed) and a network failure read
                 identically. */
              "error-callback": function (code) {
                fail(code || "unknown");
                /* Returning true keeps the widget's own message off the screen; the app
                   writes its own, in the reader's language. */
                return true;
              },
            });
          } catch (error) {
            fail("render-threw");
          }
        }

        /* The script is async, so it may not have defined turnstile yet. This is the hook it
           calls when it has, and the check below covers the race the other way. */
        window.onloadTurnstileCallback = function () {
          scriptReady = true;
          drawWhenReady();
        };
        if (window.turnstile !== undefined) window.onloadTurnstileCallback();

        /* Same origin, so this is just a fetch. A null site key means the server has the
           check switched off, in which case there is nothing to draw and nothing to say --
           the app is not showing this page at all in that case. */
        fetch("/api/v1/auth/challenge", { headers: { Accept: "application/json" } })
          .then(function (response) {
            if (!response.ok) throw new Error(String(response.status));
            return response.json();
          })
          .then(function (config) {
            if (!config || !config.siteKey) {
              fail("not-configured");
              return;
            }
            siteKey = config.siteKey;
            drawWhenReady();
          })
          .catch(function () {
            fail("config-unreachable");
          });

        /* A widget that never appears is the failure worth reporting: the phone may be on a
           network that cannot reach Cloudflare at all, and without this the sheet would sit
           with an empty box in it and nothing said. */
        window.setTimeout(function () {
          if (window.turnstile === undefined) fail("script-timeout");
        }, 15000);
      })();
    </script>
  </body>
</html>
