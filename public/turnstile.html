<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verification</title>
    <!--
      The bot check, on a page of its own, for the phone's webview to load.

      This exists because a webview cannot be handed an HTML string here. React Native
      renders one with loadHTMLString(baseURL:), and a document loaded that way has no real
      origin however respectable the baseURL looks -- so Turnstile refused to run and the app
      showed "the check could not be loaded". The same site key on the same domain has always
      worked in an ordinary browser tab, which is what narrowed it down.

      So the widget is served from the app's own domain as a real document, over https, from
      an origin that is genuinely what it says it is. That is also why the site key is fetched
      here rather than passed in the query string: same origin, so the page can simply ask.

      Kept as a static file rather than a route in the SPA: nginx serves a real file before it
      falls through to index.html, and booting the whole application inside a 72-pixel webview
      to draw one widget would be absurd.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* Matches the app's paper. The webview is exactly the widget's size, so anything
           that overflows is a scrollbar over a checkbox rather than something to reach. */
        background: #faf8f5;
        overflow: hidden;
      }
    </style>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onloadTurnstileCallback"
      async
      defer
    ></script>
  </head>
  <body>
    <div id="widget"></div>
    <script src="/turnstile.js"></script>
  </body>
</html>
